name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Inspect GLB nodes
        run: |
          python3 - <<'PY'
          import struct, json
          p='app/src/main/assets/models/conejitos_pixar.glb'
          b=open(p,'rb').read()
          magic,ver,length=struct.unpack_from('<4sII',b,0)
          off=12
          while off < length:
              n,typ=struct.unpack_from('<II',b,off); off+=8
              chunk=b[off:off+n]; off+=n
              if typ == 0x4E4F534A:
                  j=json.loads(chunk.decode('utf-8'))
                  break
          print('SCENES', j.get('scenes'))
          for i,node in enumerate(j.get('nodes',[])):
              print('NODE',i,'name=',node.get('name'),'mesh=',node.get('mesh'),'children=',node.get('children'),'translation=',node.get('translation'),'scale=',node.get('scale'))
          print('ANIMATIONS')
          for i,a in enumerate(j.get('animations',[])):
              print(i,a.get('name'))
          PY
      - name: Build APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
